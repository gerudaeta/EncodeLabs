<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="880" viewBox="0 0 1540 880" role="img" aria-labelledby="c4-containers-title c4-containers-desc">
  <title id="c4-containers-title">C4 L2 — Containers</title>
  <desc id="c4-containers-desc">The operator uses Angular. Telegram updates reach the single .NET API host through ngrok, then RabbitMQ and a background consumer in that same host persist data in PostgreSQL and notify Angular through SignalR. Outbound replies use the Telegram Bot API. Implemented and live-verified end to end; authentication is not implemented and SignalR broadcasts to all connected clients.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#2e5aa8"/>
    </marker>
    <marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1540" height="880" rx="0" fill="#f5f5f5" stroke="none" stroke-width="0"/>
