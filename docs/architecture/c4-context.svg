  <title id="c4-context-title">C4 L1 — Target architecture</title>
  <desc id="c4-context-desc">An operator would use Chat Inbox to handle conversations with Telegram users through the Telegram Bot API. The foundation PR contains application shells; Telegram exchange is planned and not functional.</desc>
