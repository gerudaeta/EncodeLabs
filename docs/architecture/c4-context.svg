    </marker>
    <marker id="slate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#4f5d75"/>
    </marker>
